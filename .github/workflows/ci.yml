name: Node.js CI & Postman Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Suite de Pruebas
        env:
          PORT: 3000
          MONGO_URL: mongodb://localhost:27017/test_ci_db
          SECRET_KEY: secret
        run: npm test

      - name: Desplegar en Render
        if: github.ref == 'refs/heads/main' && success()
        run: curl -X POST "${{ secrets.RENDER_HOOK }}"